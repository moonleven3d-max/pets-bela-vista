<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#315b43"><link rel="icon" href="icon.svg" type="image/svg+xml"><link rel="stylesheet" href="styles.css">
  <title>Administração · Pets Bela Vista</title>
</head>
<body>
<header class="topbar"><a class="brand" href="/" aria-label="Pets Bela Vista - início"><span class="brand-mark">🐾</span><span><b>Pets Bela Vista</b><small>Área administrativa</small></span></a></header>
<main class="section" style="max-width:980px;margin:3rem auto;">
  <div class="section-heading"><div><span class="eyebrow">ACESSO RESTRITO</span><h2>Área do administrador</h2><p>Entre para revisar os cadastros enviados pelos moradores.</p></div></div>
  <section class="admin-panel" style="display:block;">
    <div class="admin-login" id="adminLogin"><label>E-mail<input type="email" id="adminEmail" placeholder="E-mail da administradora" autocomplete="username"></label><label>Senha<input type="password" id="adminPassword" placeholder="Sua senha" autocomplete="current-password"></label><button class="button button-primary" id="loginBtn">Entrar</button><small>Acesso restrito à administradora autorizada.</small></div>
    <div id="adminContent" hidden><div class="admin-head"><h3>Cadastros pendentes <span class="count-pill" id="pendingCount">0</span></h3><button class="text-btn" id="logoutBtn">Sair</button></div><div id="pendingList" class="pending-list"></div><div class="admin-tools"><button class="text-btn" id="exportBtn">Exportar cadastros (JSON)</button><button class="text-btn danger-text" id="clearBtn">Apagar dados deste navegador</button></div></div>
  </section>
</main>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script type="module" src="admin.js"></script>
</body></html>
